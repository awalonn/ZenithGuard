name: ZenithGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: zenithguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install test Chrome
        run: npx puppeteer browsers install chrome

      - name: Check typed UI
        run: npm run check:types

      - name: Build extension
        run: npm run build

      - name: Validate packaged extension
        run: npm run check:dist

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: "true"
