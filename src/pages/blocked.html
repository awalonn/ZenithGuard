<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenithGuard - Blocked</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/blocked.css">
    <script type="module" src="/src/js/blocked/blocked.ts"></script>
</head>
<body data-mode="threat">
    <div class="blocked-shell">
        <header class="blocked-header">
            <img src="/icons/icon48.png" alt="ZenithGuard Logo">
            <h1>ZenithGuard</h1>
        </header>
        <main class="blocked-card">
            <div id="blocked-icon" class="blocked-icon" aria-hidden="true"></div>
            <h2 id="blocked-title" class="blocked-title">Dangerous Page Blocked</h2>
            <p id="blocked-copy" class="blocked-copy"></p>
            <div id="blocked-note" class="blocked-note" hidden></div>
        </main>
        <div class="blocked-actions">
            <button id="blocked-back-btn" class="blocked-button" type="button">Go Back Safely</button>
            <button id="blocked-visit-btn" class="blocked-button blocked-button-secondary" type="button" hidden>Visit Anyway</button>
            <button id="blocked-settings-btn" class="blocked-button blocked-button-secondary" type="button" hidden>Open Settings</button>
        </div>
    </div>
</body>
</html>
